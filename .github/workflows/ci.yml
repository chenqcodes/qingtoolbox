name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run test:seo
      - run: npm run test:tools
      - run: npm run check:labs
      - run: npm run test:science
      - run: npm run build
      - run: npm run qa:metadata
      - run: npm run qa:seo
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
      - name: Upload browser QA results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-qa-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
